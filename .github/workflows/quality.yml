name: Static quality checks

on:
  push:
    branches: [main, final-quality-overhaul]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static quality tests
        run: node --test scripts/quality.test.mjs
